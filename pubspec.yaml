name: lenscopy_mobile
description: LensCopy Mobile - On-Device Full-Screen & Camera OCR with Google Lens Interactive Selection, Clipboard History, and Supabase Sync.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Google ML Kit for 100% On-Device, Real-Time Text Recognition
  google_mlkit_text_recognition: ^0.13.0

  # Camera & Image Capture
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Supabase Client (Connected to existing LensCopy Backend)
  supabase_flutter: ^2.5.6

  # Local Storage for Permanent Clipboard Hub & License Cache
  shared_preferences: ^2.2.3

  # UI Utilities & Helpers
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
