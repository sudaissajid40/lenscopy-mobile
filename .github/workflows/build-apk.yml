name: Build LensCopy Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK for Easy Download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/LensCopy.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LensCopy-APK
          path: build/app/outputs/flutter-apk/LensCopy.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: LensCopy Mobile v1.0.0
          body: |
            ### 📱 LensCopy Mobile v1.0.0 - Ready to Install
            - **Google Lens Interactive Selection**: Tap words, drag marquee boxes, 1-tap copy.
            - **Top Taskbar Quick Settings Tile**: Swipe down your top bar to scan screen from any app!
            - **100% On-Device Privacy**: Ultra-fast Google ML Kit OCR.
            - **Permanent Clipboard Hub**: Saved clips, search, and category tagging.
            - **Supabase Cloud Sync**: Shared licensing and referral bonus system.

            **Installation Instructions:**
            1. Download `LensCopy.apk` below directly to your Android phone.
            2. Open the file and tap **Install** (allow *Install unknown apps* if prompted).
            3. Open LensCopy and start scanning!
          files: build/app/outputs/flutter-apk/LensCopy.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
